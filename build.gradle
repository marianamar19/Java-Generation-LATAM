plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hera'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // --- Core Spring Boot ---
    // Acceso a base de datos con JPA/Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Servidor web embebido (Tomcat) y soporte REST
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Seguridad: autenticacion, autorizacion y filtros HTTP
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // --- Base de datos ---
    // Driver JDBC para conectar con MySQL en tiempo de ejecucion
    runtimeOnly 'com.mysql:mysql-connector-j'

    // --- Desarrollo ---
    // Reinicio automatico del servidor al detectar cambios en el codigo
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // --- Lombok ---
    // Genera boilerplate en tiempo de compilacion (@Getter, @Builder, etc.)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- JWT (JSON Web Tokens) ---
    // API publica de JJWT: interfaces y clases que usa el codigo fuente
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    // Implementacion interna de JJWT: solo se necesita en ejecucion
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    // Serializacion/deserializacion de claims JWT usando Jackson
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // --- OpenAPI / Swagger ---
    // Genera documentacion interactiva de la API en /swagger-ui.html
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.0'

    // --- Validacion ---
    // Habilita anotaciones como @Valid, @NotBlank, @Email, @Size, etc.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // --- Tests ---
    implementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}