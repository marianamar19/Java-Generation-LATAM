# ============================================================
# CONFIGURACIÓN PARA DESARROLLO LOCAL
# ============================================================

server.port=8080

# Base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/db_hera_api
spring.datasource.username=herapruebas
spring.datasource.password=admin

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (clave por defecto para desarrollo)
jwt.secret=miClaveSecretaDefaultParaDesarrollo1234567890

# Logging
logging.level.com.hera.backend=DEBUG