# ============================================================
# CONFIGURACIÓN PARA DESARROLLO LOCAL
# ============================================================

server.port=8080

# Base de datos local
spring.datasource.url=jdbc:mysql://localhost:3306/hera_db_api_backend
spring.datasource.username=root
spring.datasource.password=generation#

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT (clave por defecto para desarrollo)
jwt.secret=miClaveSecretaDefaultParaDesarrollo1234567890

# Logging
logging.level.com.hera.backend=DEBUG

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**