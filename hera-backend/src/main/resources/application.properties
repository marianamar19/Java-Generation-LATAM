s# ============================================================
# CONFIGURACIÓN PARA AWS (PRODUCCIÓN)
# ============================================================

# Puerto del servidor
server.port=8080

# ============================================================
# BASE DE DATOS (Variables de entorno)
# ============================================================
spring.datasource.url=jdbc:mysql://${PROD_DB_HOST}:3306/${PROD_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA (Hibernate)
# ============================================================
spring.jpa.hibernate.ddl-auto=${PROD_DDL:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================================
# STATIC RESOURCES (Frontend)
# ============================================================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/*

# ============================================================
# JWT (Clave fija para producción)
# ============================================================
jwt.secret=${PROD_JWT_SECRET:}

# ============================================================
# LOGGING
# ============================================================
logging.level.com.hera.backend=INFO
logging.level.org.springframework.security=WARN