<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — HERA Admin</title>
 
  <!-- ── Tipografía compartida con el sitio ── -->
  <link rel="stylesheet" href="../../css/base/typography.css" />
 
  <!-- ── Bootstrap 5 — grid y utilidades base ── -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
 
  <!-- ── Design System Admin ── -->
  <link rel="stylesheet" href="../../css/admin/tokens-admin.css" />
  <link rel="stylesheet" href="../../css/admin/base-admin.css" />
  <link rel="stylesheet" href="../../css/admin/layout-admin.css" />
  <link rel="stylesheet" href="../../css/admin/components-admin.css" />
 
  <!-- ── Estilos exclusivos de esta página ── -->
  <link rel="stylesheet" href="../../css/admin/dashboard.css" />
</head>
<body>
 
<div class="adm-wrap">
 
  <!-- ══════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════ -->
  <div id="adm-sidebar-placeholder"></div>
 
  <!-- ══════════════════════════════════════
       MAIN
  ══════════════════════════════════════ -->
  <div class="adm-main">
 
    <!-- TOPBAR -->
    <header class="adm-topbar">
      <h1 class="adm-topbar-title">Dashboard</h1>
      <div class="adm-topbar-right">
        <span class="adm-topbar-date" id="adm-date"></span>
        <div class="adm-avatar" aria-label="Usuario administrador">AD</div>
      </div>
    </header>
 
    <!-- CONTENT -->
    <main class="adm-content">
 
      <!-- KPI CARDS -->
      <div class="adm-kpi-grid">
        <div class="adm-kpi-card">
          <div class="adm-kpi-label">Órdenes hoy</div>
          <div class="adm-kpi-value" id="kpi-ordenes">0</div>
          <div class="adm-kpi-sub">Total del día</div>
        </div>
        <div class="adm-kpi-card">
          <div class="adm-kpi-label">Ingresos hoy</div>
          <div class="adm-kpi-value adm-kpi-value--accent" id="kpi-ingresos">$0 MXN</div>
          <div class="adm-kpi-sub" id="kpi-ingresos-sub">Sin ventas registradas hoy</div>
        </div>
        <div class="adm-kpi-card">
          <div class="adm-kpi-label">Productos activos</div>
          <div class="adm-kpi-value" id="kpi-productos">0</div>
          <div class="adm-kpi-sub">En el catálogo</div>
        </div>
        <div class="adm-kpi-card" id="kpi-card-pendientes">
          <div class="adm-kpi-label">Pendientes</div>
          <div class="adm-kpi-value" id="kpi-pendientes">0</div>
          <div class="adm-kpi-sub">Por atender</div>
        </div>
      </div>
 
      <!-- GRID PRINCIPAL -->
      <div class="adm-dash-grid">
 
        <!-- COLUMNA IZQUIERDA -->
        <div class="adm-left-col">
 
          <!-- Órdenes recientes -->
          <div class="adm-card">
            <div class="adm-card-header">
              <span class="adm-card-title">Órdenes recientes</span>
              <a href="ordenes.html" class="adm-card-link">Ver todas →</a>
            </div>
            <table class="adm-table" aria-label="Tabla de órdenes recientes">
              <thead>
                <tr>
                  <th scope="col">Orden</th>
                  <th scope="col">Cliente</th>
                  <th scope="col">Productos</th>
                  <th scope="col">Total</th>
                  <th scope="col">Estatus</th>
                  <th scope="col">Fecha</th>
                </tr>
              </thead>
              <tbody id="adm-orders-tbody"></tbody>
            </table>
          </div>
 
          <!-- Gráfica de ventas -->
          <div class="adm-card">
            <div class="adm-card-header">
              <span class="adm-card-title">Ventas — últimos 7 días</span>
            </div>
            <div class="adm-chart-wrap">
              <canvas id="adm-chart-ventas"></canvas>
            </div>
          </div>
 
        </div>
 
        <!-- COLUMNA DERECHA -->
        <div class="adm-right-col">
 
          <div class="adm-card">
            <div class="adm-card-header">
              <span class="adm-card-title">Estatus de órdenes</span>
            </div>
            <div id="adm-status-list"></div>
          </div>
 
          <div class="adm-card">
            <div class="adm-card-header">
              <span class="adm-card-title">Más vendidos</span>
            </div>
            <div id="adm-top-products"></div>
          </div>
 
        </div>
 
      </div>
    </main>
  </div>
 
</div>
 
<!-- Bootstrap JS — necesario para utilidades de componentes Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
<!-- Chart.js — debe cargarse antes que dashboard.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
 
<!-- Script de la página -->
<script type="module" src="../../js/admin/dashboard.js"></script>
 
</body>
</html>
