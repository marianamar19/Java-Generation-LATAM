<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Producto — HERA Perfumes &amp; Joyería</title>
  <meta name="description" id="meta-description" content="Detalles del producto en HERA." />

  <!-- CSS Base -->
  <link rel="stylesheet" href="../css/base/tokens.css" />
  <link rel="stylesheet" href="../css/base/reset.css" />
  <link rel="stylesheet" href="../css/base/typography.css" />
  <link rel="stylesheet" href="../css/base/buttons.css" />
  <link rel="stylesheet" href="../css/base/layout.css" />

  <!-- Componentes universales -->
  <link rel="stylesheet" href="../css/components/navbar.css" />
  <link rel="stylesheet" href="../css/components/drawer.css" />
  <link rel="stylesheet" href="../css/components/product-card.css" />
  <link rel="stylesheet" href="../css/components/newsletter.css" />
  <link rel="stylesheet" href="../css/components/footer.css" />

  <!-- Estilos exclusivos de producto -->
  <link rel="stylesheet" href="../css/pages/producto.css" />
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="site-wrap">

  <section class="product-stage">
    <div class="product-layout">

      <!-- Galería de imágenes (dinámica) -->
      <div class="product-gallery">
        <div class="product-thumbs-wrap">
          <button class="thumb-nav-btn" id="thumb-prev" disabled>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="m18 15-6-6-6 6"/>
            </svg>
          </button>
          <div class="product-thumbs" id="product-thumbs"></div>
          <button class="thumb-nav-btn" id="thumb-next">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
        </div>
        <div class="product-img-main">
          <img id="main-product-img" alt="Imagen principal del producto" style="width:100%; height:100%; object-fit:contain;" />
        </div>
      </div>

      <!-- Información del producto (dinámica) -->
      <div class="product-info">
        <div class="product-badge" id="prod-badge"></div>
        <div class="product-brand-tag" id="prod-brand"></div>
        <h1 class="product-name" id="prod-name"></h1>
        <div class="product-concentration" id="prod-concentration"></div>
        <div class="product-meta-chips" id="prod-chips"></div>
        <div class="product-rating-row" id="prod-rating-row">
          <span class="product-stars" id="prod-stars-display"></span>
          <span class="product-rating-num" id="prod-rating"></span>
          <span class="product-rating-count" id="prod-review-count"></span>
        </div>
        <div class="product-price" id="prod-price"></div>
        <div class="product-size-label">Presentación</div>
        <div class="product-sizes" id="prod-sizes"></div>
        <div class="prod-nivel-badge" id="prod-nivel-badge">
          <span class="prod-nivel-badge-dot"></span>
          <span id="prod-nivel-label"></span>
        </div>
        <div class="product-actions">
          <button class="btn-add-cart" id="btn-add-cart-main">Añadir al carrito</button>
          <button class="btn-fav-lg" id="btn-fav-main" aria-label="Guardar en favoritos">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </button>
        </div>
        <hr class="product-divider" />
        <p class="product-desc" id="prod-desc"></p>
      </div>

    </div>
  </section>

  <!-- Notas olfativas (dinámico) -->
  <section class="product-notes-section">
    <div class="notes-section-header reveal">
      <div class="notes-section-eyebrow">Composición</div>
      <div class="notes-section-title">Notas <em>olfativas</em></div>
    </div>
    <div class="notes-cols reveal" id="notes-cols">
      <div class="notes-col"><div class="notes-col-label">Salida</div><ul id="notes-head"></ul></div>
      <div class="notes-col"><div class="notes-col-label">Corazón</div><ul id="notes-heart"></ul></div>
      <div class="notes-col"><div class="notes-col-label">Base</div><ul id="notes-base"></ul></div>
    </div>
  </section>

  <!-- Ficha técnica (dinámica) -->
  <section class="product-details">
    <div class="details-eyebrow reveal">Perfil del perfume</div>
    <div class="details-grid" id="details-grid"></div>
  </section>

  <!-- Performance (dinámico) -->
  <section class="product-performance">
    <div class="perf-header reveal">
      <div><div class="perf-section-label">Desempeño</div><div class="perf-title">¿Cómo se <em>comporta?</em></div></div>
    </div>
    <div class="perf-grid" id="perf-grid"></div>
  </section>

  <!-- Contexto de uso (dinámico) -->
  <section class="product-context">
    <div class="context-eyebrow reveal">Cuándo usarlo</div>
    <div id="context-container"></div>
  </section>

  <!-- Familia del perfume (dinámico) -->
  <section class="product-family" id="family-section">
    <div class="family-header reveal">
      <div class="family-eyebrow">La familia</div>
      <div class="family-title">Otras versiones de <em id="family-title-name"></em></div>
    </div>
    <div class="family-grid reveal" id="family-scroll"></div>
  </section>

  <!-- Reseñas (dinámico) -->
  <section class="product-reviews" id="reviews-section">
    <div class="reviews-eyebrow reveal">Lo que dicen</div>
    <div class="reviews-layout" id="reviews-layout"></div>
  </section>

  <!-- Productos similares (dinámico) -->
  <section class="product-similar">
    <div class="similar-eyebrow">Quizás también</div>
    <div class="similar-title"><strong>También te</strong> podría gustar</div>
    <div class="similar-grid" id="similar-grid"></div>
  </section>

  <div id="newsletter-placeholder"></div>
  <div id="footer-placeholder"></div>

</div>

<div id="cart-drawer-placeholder"></div>

<script type="module" src="../js/pages/producto.js"></script>
</body>
</html>
